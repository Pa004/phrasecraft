name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci --no-audit --no-fund
      - run: npx biome check .
      - run: npx astro check
      - run: npx vitest run
      - run: node scripts/validate-wordlist.mjs
      - run: npm run build
